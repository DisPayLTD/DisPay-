<!DOCTYPE html>
<html lang="en">
	
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisPay - Authentication</title>
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <div class="logo">
                <img src="https://www.image2url.com/r2/default/images/image-to-webp-1784900850227-f1a6a09e-8ab8-49ea-b146-30cc044a0ff6.webp" alt=""width="150px">
            </div>
            
            <!-- LOGIN FORM -->
            <div id="loginForm" class="form-section ">
                 <h2>Login</h2>
                <input type="email" id="loginEmail" placeholder="Email" required>
                
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button onclick="handleLogin()" class="btn btn-primary">Login</button>
                <p class="toggle-text">Don't have an account? <a onclick="toggleForm('signup')">Sign Up</a></p>
                <p><a id="forgotPass" style="color:blue" onclick="toggleForm('methodOfVerification');">Forgot password?</a></p>
            </div>

            <!-- SIGNUP FORM -->
            <div id="signup" class="form-section hidden">
                <h2>Create Account</h2>
                <input type="text" id="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" placeholder="Last Name" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" minlength="6"required>
                <input type="tel" id="phone" placeholder="Phone Number"  minlength="11" maxlength="11" required>
                <input type="text" id="nin" placeholder="NIN (National ID)" required>
                <input type="text" id="bvn" placeholder="BVN (Optional)" minlength="11" maxlength="11" >
                <button onclick="handleSignup()" class="btn btn-success">Sign Up</button>
                <p class="toggle-text">Already have an account? <a onclick="toggleForm('loginForm')">Login</a></p>
            </div>
            
            <!-- Method of Verification-->
            <div class="form-section hidden" id="methodOfVerification">
                <h2>Method Of Verification</h2>
                <input type="email" id="userEmail" placeholder="Enter Email" required>
                <button onclick="sendOtp()" class="btn btn-primary" id="send-otp-btn">Send OTP</button>
                
                <p class="toggle-text">Already have an account? <a onclick="toggleForm('loginForm')">Login</a></p>
            </div>
            
     <!-- OTP verification-->
               
		<div id="otp-box" class="otp-box hidden" >
		<h2>Enter Your OTP</h2>
        <br>
        <i id="otpMsg" ></i>
		<br><br>
	<!--Container for otp message-->
		<div class="input-container">
		<input type="text" inputmode="numeric" oninput = "this.value = this.value.replace(/\D/g, '')" maxlength = "1" placeholder="·" class="code-box">

		<input type="text" inputmode="numeric" oninput = "this.value = this.value.replace(/\D/g, '')" maxlength = "1" placeholder="·" class="code-box">

		<input type="text" inputmode="numeric" oninput = "this.value = this.value.replace(/\D/g, '')" maxlength = "1" placeholder="·" class="code-box">

		<input type="text" inputmode="numeric" oninput = "this.value = this.value.replace(/\D/g, '')" maxlength = "1" placeholder="·" class="code-box">

		<input type="text" inputmode="numeric" oninput = "this.value = this.value.replace(/\D/g, '')" maxlength = "1" placeholder="·" class="code-box">

		<input type="text" inputmode="numeric" oninput = "this.value = this.value.replace(/\D/g, '')" maxlength = "1" placeholder="·" class="code-box">
		</div>
		<br><br>
		<button class="btn btn-primary" id="verify-btn">Verify</button>
        <p class="toggle-text">Didn't get the OTP? <a onclick="sendOtp()" style="background-color:#04BADE">Resend</a></p>
        <p class="toggle-text">Already have an account? <a onclick="toggleForm('loginForm')">Login</a></p>
	</div>
            <!--New password entrance block-->
            
            <div id="changePasswordBox" class="form-section hidden">
                <input type="text" id="newPassword" placeholder="New Password" required>
                <input type="text" id="confirmPassword" placeholder="Confirm password" required>
                <button class="btn btn-primary" id="confirmChangePasswordBtn" onclick="changePassword()">Confirm</button>
            </div>
            
            <div id="errorMessage" class="error-message hidden"></div>
            <div id="successMessage" class="success-message hidden"></div>
        </div>
    </div>

    <!--loading overley-->
    <div id="loading-overlay" class="loading-overlay hidden">
        <img src="https://www.image2url.com/r2/default/images/image-to-webp-1784915373221-2ce47afb-31fc-4b3f-af02-80a51b1015d7.webp" alt="DisPay Loading" class="loadingImg">
    </div>
	
    <script src="/static/auth.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hideshowpassword/2.2.0/hideShowPassword.min.js"></script>
<script>
    $(document).ready(function() {
        // Target your specific login password ID
        $('#loginPassword').hideShowPassword({
            show: false,          // Keep password masked initially
            innerToggle: true,    // Injects a "Show" button inside the right edge of the input
            touchSupport: true    // Ensures it works smoothly on mobile/tablet screens
            
        });
        const wrapper = document.getElementById('loginPassword').parentElement;
        wrapper.style.width = '100%';
        wrapper.style.display = 'block';
    });
    
    </script>
</body>
</html>
