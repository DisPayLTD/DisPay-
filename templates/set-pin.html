<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Transaction PIN - DisPay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        .container h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
            font-size: 24px;
        }
        
        .container p {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .pin-input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .pin-input {
            width: 60px;
            height: 60px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .pin-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 10px;
        }
        
        .btn:hover {
            background: #764ba2;
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
            font-weight: bold;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            color: #004085;
            font-size: 13px;
            margin-bottom: 20px;
            border-left: 4px solid #004085;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 Set Transaction PIN</h2>
        <p>Secure your payments with a 4-digit PIN</p>
        
        <div id="message" class="message"></div>
        
        <div class="info">
            ℹ️ Your PIN protects your account. You'll need to enter it every time you send money.
        </div>
        
        <div class="pin-input-group">
            <input class="pin-input" id="pin1" type="password" maxlength="1" placeholder="•">
            <input class="pin-input" id="pin2" type="password" maxlength="1" placeholder="•">
            <input class="pin-input" id="pin3" type="password" maxlength="1" placeholder="•">
            <input class="pin-input" id="pin4" type="password" maxlength="1" placeholder="•">
        </div>
        
        <button class="btn" id="setBtn" onclick="setPin()">Set PIN</button>
        <!--<button class="btn btn-secondary" onclick="goToDashboard()">Skip for now</button>--/>
    </div>
    
    <script>
// ===== HELPER FUNCTIONS =====
function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = `message ${type}`;
}

function goToDashboard() {
    window.location.href = '/dashboard';
}

// ===== GET CSRF TOKEN =====
function getCsrfTokenFromCookie() {
    const name = "csrftoken=";
    const decodedCookie = decodeURIComponent(document.cookie);
    const cookieArray = decodedCookie.split(';');
    for(let i = 0; i < cookieArray.length; i++) {
        let cookie = cookieArray[i].trim();
        if (cookie.indexOf(name) === 0) return cookie.substring(name.length);
    }
    return null;
}

// ===== SET PIN FUNCTION =====
async function setPin() {
    const inputs = document.querySelectorAll('.pin-input');
    const pin = Array.from(inputs).map(i => i.value).join('');
    
    if (pin.length !== 4) {
        showMessage('Please enter a 4-digit PIN', 'error');
        return;
    }
    
    const setBtn = document.getElementById("setBtn");
    
    try {
        setBtn.textContent = "Processing...";
        setBtn.disabled = true; 
        
        const res = await fetch('/set-transaction-pin', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFTOKEN': getCsrfTokenFromCookie()
            },
            body: JSON.stringify({ pin })
        });
        alert("the function is called ");
        const data = await res.json();
        alert(JSON.stringify(data));
        if (data.status === 'success') {
            showMessage('✅ PIN set successfully!', 'success');
            setTimeout(() => goToDashboard(), 1500);
        } else {
            showMessage(data.message || 'Failed to set PIN', 'error');
        }
    } catch (error) {
        showMessage('Error: ' + error.message, 'error');
    } finally {
        setBtn.textContent = "Set PIN";
        setBtn.disabled = false;
    }
}

// ===== AUTO-FOCUS PIN INPUTS =====
document.querySelectorAll('.pin-input').forEach((input, index) => {
    input.addEventListener('input', (e) => {
        if (e.target.value && index < 3) {
            document.querySelectorAll('.pin-input')[index + 1].focus();
        }
    });
    
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
            document.querySelectorAll('.pin-input')[index - 1].focus();
        }
    });
});
    </script>
