<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DisPay — Payroll that pays itself</title>
<style>
  :root {
    --violet-1: #667eea;
    --violet-2: #764ba2;
    --green: #4caf50;
    --green-dark: #45a049;
    --ink: #2b2b33;
    --text-dim: #666;
    --line: #eceaf5;
    --card: #ffffff;
    --bg: #f7f7fb;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 28px; }

  /* ---------- Nav ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
  }
  .logo {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--violet-2);
  }
  .logo .mark {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--violet-1), var(--violet-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }
  .nav-links {
    display: flex;
    gap: 34px;
    font-size: 14.5px;
    color: var(--text-dim);
  }
  .nav-links a:hover { color: var(--violet-2); }
  .nav-cta {
    background: linear-gradient(135deg, var(--violet-1), var(--violet-2));
    color: #fff;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 6px 18px -6px rgba(102,126,234,0.55);
  }
  .nav-cta:hover { filter: brightness(1.07); }
  .nav-mobile-hide { display: flex; }
  @media (max-width: 720px) { .nav-mobile-hide { display: none; } }

  /* ---------- Hero ---------- */
  .hero-outer {
    background: linear-gradient(135deg, var(--violet-1) 0%, var(--violet-2) 100%);
    padding: 90px 0 130px;
    position: relative;
    overflow: hidden;
  }
  .hero-outer::before {
    content: "";
    position: absolute;
    width: 520px; height: 520px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    top: -220px; right: -140px;
  }
  .hero {
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 48px;
    align-items: center;
    position: relative;
    z-index: 2;
  }
  @media (max-width: 900px) {
    .hero { grid-template-columns: 1fr; padding-top: 10px; }
    .hero-outer { padding: 60px 0 90px; }
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 7px 14px;
    border-radius: 999px;
    margin-bottom: 26px;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  h1 {
    font-weight: 700;
    font-size: clamp(36px, 5vw, 56px);
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: #fff;
  }
  h1 .accent { color: #d9ffd0; }
  .hero p.sub {
    margin-top: 22px;
    font-size: 17px;
    line-height: 1.65;
    color: rgba(255,255,255,0.88);
    max-width: 470px;
  }
  .hero-ctas { margin-top: 32px; display: flex; gap: 14px; flex-wrap: wrap; }
  .btn-primary {
    background: #fff;
    color: var(--violet-2);
    padding: 14px 26px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 10px 26px -8px rgba(0,0,0,0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); }
  .btn-ghost {
    padding: 14px 24px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.1); }
  .hero-note { margin-top: 24px; font-size: 13px; color: rgba(255,255,255,0.85); }
  .hero-note b { color: var(--green); background: #fff; padding: 1px 6px; border-radius: 5px; }

  /* ---------- Receipt card (signature element, matches auth-box style) ---------- */
  .receipt-stage { display: flex; justify-content: center; align-items: center; }
  .receipt {
    width: 320px;
    background: var(--card);
    border-radius: 15px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 30px 26px 24px;
    animation: floaty 6s ease-in-out infinite;
    position: relative;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0px) rotate(-1deg); }
    50% { transform: translateY(-12px) rotate(0.6deg); }
  }
  .receipt-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--line);
  }
  .receipt-head .paid {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--green-dark);
    background: rgba(76,175,80,0.12);
    padding: 4px 10px;
    border-radius: 999px;
  }
  .receipt-head .id { font-size: 11px; color: #999; }
  .receipt-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    font-size: 13.5px;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
  }
  .receipt-row span:first-child { color: var(--text-dim); }
  .receipt-amount { padding-top: 18px; text-align: center; }
  .receipt-amount .label {
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .receipt-amount .value {
    font-size: 32px; font-weight: 700; margin-top: 4px;
    color: var(--violet-2);
  }
  .receipt-fee { margin-top: 14px; text-align: center; font-size: 11.5px; color: var(--text-dim); }
  .receipt-fee b { color: var(--ink); }
  .receipt-ping {
    position: absolute; top: -14px; right: -14px;
    background: var(--green);
    color: #fff;
    font-weight: 700;
    font-size: 11px;
    padding: 7px 12px;
    border-radius: 999px;
    box-shadow: 0 10px 22px -6px rgba(76,175,80,0.55);
  }

  /* ---------- AI section ---------- */
  .ai-section {
    background: linear-gradient(135deg, var(--violet-1) 0%, var(--violet-2) 100%);
    padding: 90px 0;
    position: relative;
    overflow: hidden;
  }
  .ai-inner {
    display: grid;
    grid-template-columns: 0.95fr 1.05fr;
    gap: 50px;
    align-items: center;
  }
  @media (max-width: 900px) { .ai-inner { grid-template-columns: 1fr; } }
  .ai-copy .kicker { color: var(--green); }
  .ai-copy h2 { color: #fff; }
  .ai-copy p.sub {
    margin-top: 16px;
    color: rgba(255,255,255,0.88);
    font-size: 16px;
    line-height: 1.65;
    max-width: 460px;
  }
  .ai-points {
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .ai-point {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    color: #fff;
    font-size: 14.5px;
  }
  .ai-point .dot {
    flex: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }
  .ai-point b { display: block; margin-bottom: 2px; }
  .ai-point span.desc { color: rgba(255,255,255,0.8); font-size: 13.5px; }

  .ai-demo-stage {
    position: relative;
    max-width: 420px;
    margin: 0 auto;
    padding-bottom: 70px;
  }
  .command-card {
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 24px 24px 20px;
  }
  .command-card .cc-label { font-size: 13px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .command-card .cc-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 14px; }
  .command-box {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13.5px;
    color: var(--ink);
    background: var(--bg);
    min-height: 54px;
  }
  .command-card .cc-btn {
    margin-top: 14px;
    width: 100%;
    text-align: center;
    background: linear-gradient(135deg, var(--violet-1), var(--violet-2));
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 12px;
    border-radius: 10px;
  }
  .pin-modal {
    position: absolute;
    left: 50%;
    bottom: -30px;
    transform: translateX(-50%);
    width: 88%;
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 26px 60px rgba(0,0,0,0.4);
    padding: 20px 20px 18px;
    z-index: 3;
  }
  .pin-modal .pm-title { font-size: 14px; font-weight: 700; color: var(--ink); text-align: center; }
  .pin-modal .pm-sub { font-size: 11.5px; color: var(--text-dim); text-align: center; margin-top: 4px; margin-bottom: 14px; }
  .pin-boxes { display: flex; justify-content: center; gap: 10px; }
  .pin-box {
    width: 40px; height: 46px;
    border: 1.5px solid var(--violet-1);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--violet-2);
    background: var(--bg);
  }
  .pin-modal .pm-btn {
    margin-top: 16px;
    text-align: center;
    background: var(--green);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    padding: 11px;
    border-radius: 9px;
  }


  section { padding: 90px 0; }
  .section-head { max-width: 620px; margin-bottom: 50px; }
  .kicker {
    font-size: 12.5px; font-weight: 700;
    color: var(--violet-2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: block;
  }
  h2 {
    font-weight: 700;
    font-size: clamp(27px, 3.4vw, 36px);
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--ink);
  }
  .section-head p { margin-top: 16px; color: var(--text-dim); font-size: 16px; line-height: 1.6; }

  /* ---------- Features ---------- */
  .features { background: var(--bg); }
  .feature-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  @media (max-width: 860px) { .feature-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .feature-grid { grid-template-columns: 1fr; } }
  .feature {
    background: var(--card);
    border-radius: 14px;
    padding: 30px 26px;
    box-shadow: 0 6px 24px rgba(102,78,200,0.08);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .feature:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(102,78,200,0.16); }
  .feature .icon {
    width: 42px; height: 42px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--violet-1), var(--violet-2));
    font-size: 18px;
    margin-bottom: 18px;
  }
  .feature h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; color: var(--ink); }
  .feature p { font-size: 14px; color: var(--text-dim); line-height: 1.55; }

  /* ---------- Pricing band ---------- */
  .pricing-band { padding: 20px 0 90px; }
  .pricing-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 30px;
    background: linear-gradient(135deg, var(--violet-1), var(--violet-2));
    border-radius: 20px;
    padding: 44px 46px;
    box-shadow: 0 20px 50px -18px rgba(102,78,200,0.5);
  }
  .pricing-copy h3 { font-size: 23px; font-weight: 700; margin-bottom: 10px; color: #fff; }
  .pricing-copy p { color: rgba(255,255,255,0.85); font-size: 15px; max-width: 380px; }
  .price-tag { display: flex; align-items: baseline; gap: 8px; }
  .price-tag .num { font-size: 50px; font-weight: 800; color: var(--green); text-shadow: 0 2px 0 rgba(0,0,0,0.08); }
  .price-tag .per { font-size: 14px; color: rgba(255,255,255,0.85); }

  /* ---------- Footer ---------- */
  footer { border-top: 1px solid var(--line); padding: 56px 0 36px; background: var(--card); }
  .footer-top { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 40px; padding-bottom: 40px; }
  .footer-brand .logo { margin-bottom: 14px; }
  .footer-brand p { color: var(--text-dim); font-size: 14px; max-width: 300px; line-height: 1.6; }
  .footer-col h4 { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 14px; }
  .footer-col a, .footer-col p { display: block; font-size: 14.5px; color: var(--ink); margin-bottom: 10px; }
  .footer-col a:hover { color: var(--violet-2); }
  .footer-bottom {
    border-top: 1px solid var(--line);
    padding-top: 24px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    font-size: 12.5px; color: var(--text-dim);
  }

  @media (prefers-reduced-motion: reduce) {
    .receipt { animation: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <nav>
      <div class="logo"><img src="https://www.image2url.com/r2/default/images/image-to-webp-1784915373221-2ce47afb-31fc-4b3f-af02-80a51b1015d7.webp" alt="DisPay" style="width:32px;height:32px;object-fit:contain;">DisPay</div>
      <p>A DeltaCore Limited product (RC 9664409) — payroll and payment infrastructure for Nigerian businesses.</p>
      </div>

      <div class="footer-col">
        <h4>Get in touch</h4>
        <a href="mailto:support@dispay.com">support@dispay.com</a>
        <a href="https://dispay.com.ng">dispay.com.ng</a>
      </div>

      <div class="footer-col">
        <h4>Company</h4>
        <p>DeltaCore Limited</p>
        <p>Kano, Nigeria</p>
      </div>
    </div>

    <div class="footer-bottom">
      <span>© 2026 DeltaCore Limited. All rights reserved.</span>
      <span>DisPay — pay everyone, automatically.</span>
    </div>
  </div>
</footer>

</body>
</html>
