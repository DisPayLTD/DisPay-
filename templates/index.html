<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Salary Payment Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>💰 AI Salary Payment Agent</h1>
            <p id="status">✅ Authenticated - Ready to pay</p>
        </header>

        <main class="main">
            <!-- Step 1: Make Payment -->
            <section id="paymentSection" class="section">
                <h2>✅ Step 1: Make Payment</h2>
                <textarea id="command" placeholder="Example: Pay Usman 1M to UBA bank account number 0123456789 OR Upload a file in format xlsx,csv" rows="4"></textarea>
                
                <button onclick="executePayment()" class="btn btn-success">Execute Payment</button>

                <!-- FILE UPLOAD SECTION -->
                <div class="upload-section">
                    <h3>📁 Or Upload CSV/Excel File</h3>
                    <input type="file" id="paymentFile" accept=".csv,.xlsx,.xls">
                    <button onclick="uploadFile()" class="btn btn-primary">Upload and Process File</button>
                </div>
                
                <!-- Results -->
                <div id="results" class="results hidden">
                    <h3>Payment Results</h3>
                    <pre id="resultsContent"></pre>
                    <h3>Success Transfers</h3>
                    <div id="successTransfer"></div>
                    <h3>Failed Transfers</h3>
                    <div id="failedTransfers"></div>
                </div>
            </section>
        </main>

        <!-- Logout Button -->
        <footer style="text-align: center; padding: 20px; background: #f9f9f9;">
            <button onclick="logout()" class="btn" style="background: #f44336; color: white; max-width: 150px;">Logout</button>
        </footer>
    </div>

    <script src="/static/script.js"></script>
    <script>
    console.log('Checking if static files are mounted...');
    fetch('/static/script.js')
        .then(res => {
            console.log('script.js status:', res.status);
            if (res.ok) {
                alert('✅ script.js found!');
            } else {
                alert('❌ script.js not found - status ' + res.status);
            }
        })
        .catch(err => alert('❌ Error: ' + err));
</script>
<script src="/static/script.js"></script>
</body>
</html>
