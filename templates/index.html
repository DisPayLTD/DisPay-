<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisPay - Payment Disbursement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        
        svg {
            width: 200px;
            height: 200px;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .tagline {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        
        .features {
            text-align: left;
            color: #555;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .features li {
            margin-bottom: 10px;
            list-style: none;
            padding-left: 25px;
            position: relative;
        }
        
        .features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #0052CC;
            font-weight: bold;
            font-size: 18px;
        }
        
        .cta-button {
            margin-top: 30px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- DisPay Logo -->
        <img src="static/images/1783686488495.png" alt="dispay-logo" width="200px" style="border-radius:5px; border:2px solid #fff ">
        
        <p class="tagline">AI-Powered Payment Disbursement</p>
        
        <ul class="features">
            <li>Instant Salary Disbursement</li>
            <li>Batch Payment Processing</li>
            <li>2% Commission on Bulk Transfers</li>
            <li>Secure PIN Protection</li>
            <li>Real-time Transaction History</li>
            <li>Monnify Integration</li>
            <li>Bills Payment</li>
            <i>Use Of Natural Language To Perform Tasks</i>
        </ul>
        
        <button class="cta-button" id="getStartedBtn">Get Started</button>
    </div>
</body>
<script>
    const getStartedBtn = document.getElementById("getStartedBtn");
    
    getStartedBtn.addEventListener("click",()=>{
        
        getStartedBtn.textContent = "Processing...";
        try{
            
            window.location.href = "https://dispay-web-sevice.onrender.com/auth";
            getStartedBtn.disabled = true;
        } catch{
            console.log("couldn't fetch page");
        } finally{
            getStartedBtn.textContent = "Get Started";
            getStartedBtn.disabled = false;
        }
    })
</script>
            </html>
